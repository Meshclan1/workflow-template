name: deployment workflow

on:
  push:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    environment: development

    env:
    SECRET_NAME: ${{ secrets.CHERRY }}
    VARIABLE_NAME: ${{ vars.APPLE}}

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: print out values
      - run: echo "hello world"
      - run: echo ${{env.SECRET_NAME}}
      - run: echo ${{env.VARIABLE_NAME}}
