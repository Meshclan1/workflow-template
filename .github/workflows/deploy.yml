name: deployment workflow

on:
  push:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    environment: development
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    env:
      SECRET_NAME: ${{ secrets.CHERRY }}
      VARIABLE_NAME: ${{ vars.APPLE }}

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: print out value
        run: echo "hello world"

      - name: print out value
        run: echo ${{ env.VARIABLE_NAME }}

      - name: print out secret value
        run: echo "Secret is configured — length $(echo -n $SECRET_NAME | wc -c) chars"
  tests:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Running tests"

  build:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - run: echo "Building image"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - run: echo "Deploying"
