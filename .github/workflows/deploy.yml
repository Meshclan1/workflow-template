name: deployment workflow

on:
  push:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    environment: development
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    env:
      SECRET_NAME: ${{ secrets.CHERRY }}
      VARIABLE_NAME: ${{ vars.APPLE }}

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: print out value
        run: echo "hello world"

      - name: print out value
        run: echo ${{ env.VARIABLE_NAME }}

      - name: print out secret value
        run: echo "Secret is configured — length $(echo -n $SECRET_NAME | wc -c) chars"
