name: featue development workflow

on:
  push:
    branches:
      - featurebranch

jobs:
  feature_test:
    runs-on: ubuntu-latest
    environment: production
    if: github.event_name == 'push' && github.branch == 'ref/heads/featurebranch'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
      - name: printing the scores
        run: echo 5 and 'six' means 678
